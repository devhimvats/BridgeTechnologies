<!DOCTYPE html>
<html lang="en">
<head>
<META HTTP-EQUIV="Content-type" CONTENT="text/html; charset=UTF-8">
<title>Thank You — Bridge Technologies</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif; background:#f4f5f7; margin:0;
    padding:40px 20px; min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .card {
    max-width: 480px; width:100%; background:#fff; padding:44px 40px; border-radius:8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1); text-align:center;
  }
  .check {
    width:56px; height:56px; border-radius:50%; background:#04844b; color:#fff;
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px;
    font-size:28px; line-height:1;
  }
  h1 { font-size: 20px; margin: 0 0 12px; color:#1a1a1a; }
  p { margin: 0 0 8px; color:#444; font-size: 14px; line-height:1.5; }
  p.muted { color:#888; font-size:13px; margin-top:20px; }
</style>
</head>
<body>
  <div class="card">
    <div class="check">&#10003;</div>
    <h1>Thank You for Your Enquiry</h1>
    <p>Your enquiry has been submitted successfully.</p>
    <p>One of our representatives will contact you within 1–2 business days.</p>
    <p class="muted">Bridge Technologies</p>
  </div>
</body>
</html>
