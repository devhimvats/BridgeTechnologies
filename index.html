<!DOCTYPE html>
<html lang="en">
<head>
<META HTTP-EQUIV="Content-type" CONTENT="text/html; charset=UTF-8">
<title>Bridge Technologies CRM — Web-to-Lead</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; background:#f4f5f7; margin:0; padding:40px 20px; }
  .form-wrap { max-width: 760px; margin: 0 auto; background:#fff; padding:36px 40px; border-radius:8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  h1 { font-size: 22px; margin: 0 0 4px; color:#1a1a1a; }
  p.sub { margin: 0 0 28px; color:#666; font-size: 14px; }

  fieldset {
    border: none; border-top: 1px solid #e2e2e2; margin: 0 0 26px; padding: 20px 0 0;
  }
  fieldset:first-of-type { border-top: none; padding-top: 0; }
  legend {
    font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.04em;
    color: #0070d2; padding: 0; margin-bottom: 12px;
  }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px;
  }
  .field { margin-top: 12px; }
  .field.full { grid-column: 1 / -1; }
  .field:first-child, .grid > .field:nth-child(-n+2) { margin-top: 0; }

  label { display:block; margin-bottom:4px; font-size:13px; font-weight:bold; color:#333; }
  label .req { color:#c23934; margin-left:2px; }
  input[type=text], select, textarea {
    width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;
    font-size:14px;
  }
  textarea { min-height:56px; resize:vertical; }

  .checkbox-row { display:flex; align-items:center; gap:8px; margin-top:12px; }
  .checkbox-row label { margin:0; font-weight:bold; }

  input[type=submit] {
    margin-top:8px; background:#0070d2; color:#fff; border:none; padding:11px 28px;
    border-radius:4px; font-size:14px; font-weight:bold; cursor:pointer;
  }
  input[type=submit]:hover { background:#005fb2; }

  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    .grid > .field { margin-top: 12px !important; }
  }
</style>
</head>
<body>
<div class="form-wrap">
  <h1>Request a Consultation</h1>
  <p class="sub">Bridge Technologies — IT consulting</p>

<form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00DDn000002qJHu" method="POST">

<input type=hidden name="oid" value="00DDn000002qJHu">
<input type=hidden name="retURL" value="thank-you.html">

<!-- Uncomment for debug mode testing
<input type="hidden" name="debug" value=1>
<input type="hidden" name="debugEmail" value="hvats33@gmail.com">
-->

<fieldset>
  <legend>Contact Information</legend>
  <div class="grid">
    <div class="field">
      <label for="salutation">Salutation</label>
      <select id="salutation" name="salutation">
        <option value="">--None--</option>
        <option value="Mr.">Mr.</option>
        <option value="Ms.">Ms.</option>
        <option value="Mrs.">Mrs.</option>
        <option value="Dr.">Dr.</option>
        <option value="Prof.">Prof.</option>
      </select>
    </div>
    <div class="field">
      <label for="title">Title</label>
      <input id="title" maxlength="40" name="title" size="20" type="text" />
    </div>
    <div class="field">
      <label for="first_name">First Name<span class="req">*</span></label>
      <input id="first_name" maxlength="40" name="first_name" size="20" type="text" required />
    </div>
    <div class="field">
      <label for="last_name">Last Name<span class="req">*</span></label>
      <input id="last_name" maxlength="80" name="last_name" size="20" type="text" required />
    </div>
    <div class="field">
      <label for="email">Email<span class="req">*</span></label>
      <input id="email" maxlength="80" name="email" size="20" type="text" required />
    </div>
    <div class="field">
      <label for="phone">Phone<span class="req">*</span></label>
      <input id="phone" maxlength="40" name="phone" size="20" type="text" required />
    </div>
    <div class="field">
      <label for="mobile">Mobile</label>
      <input id="mobile" maxlength="40" name="mobile" size="20" type="text" />
    </div>
    <div class="field">
      <label for="url">Website</label>
      <input id="url" maxlength="80" name="url" size="20" type="text" />
    </div>
  </div>
</fieldset>

<fieldset>
  <legend>Company &amp; Location</legend>
  <div class="grid">
    <div class="field full">
      <label for="company">Company</label>
      <input id="company" maxlength="40" name="company" size="20" type="text" />
    </div>
    <div class="field full">
      <label for="street">Street</label>
      <textarea name="street"></textarea>
    </div>
    <div class="field">
      <label for="city">City</label>
      <input id="city" maxlength="40" name="city" size="20" type="text" />
    </div>
    <div class="field">
      <label for="state">State/Province</label>
      <input id="state" maxlength="20" name="state" size="20" type="text" />
    </div>
    <div class="field">
      <label for="zip">Zip</label>
      <input id="zip" maxlength="20" name="zip" size="20" type="text" />
    </div>
    <div class="field">
      <label for="country">Country</label>
      <input id="country" maxlength="40" name="country" size="20" type="text" />
    </div>
    <div class="field">
      <label for="industry">Industry</label>
      <select id="industry" name="industry">
        <option value="">--None--</option>
        <option value="Agriculture">Agriculture</option>
        <option value="Apparel">Apparel</option>
        <option value="Banking">Banking</option>
        <option value="Biotechnology">Biotechnology</option>
        <option value="Chemicals">Chemicals</option>
        <option value="Communications">Communications</option>
        <option value="Construction">Construction</option>
        <option value="Consulting">Consulting</option>
        <option value="Education">Education</option>
        <option value="Electronics">Electronics</option>
        <option value="Energy">Energy</option>
        <option value="Engineering">Engineering</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Environmental">Environmental</option>
        <option value="Finance">Finance</option>
        <option value="Food &amp; Beverage">Food &amp; Beverage</option>
        <option value="Government">Government</option>
        <option value="Healthcare">Healthcare</option>
        <option value="Hospitality">Hospitality</option>
        <option value="Insurance">Insurance</option>
        <option value="Machinery">Machinery</option>
        <option value="Manufacturing">Manufacturing</option>
        <option value="Media">Media</option>
        <option value="Not For Profit">Not For Profit</option>
        <option value="Recreation">Recreation</option>
        <option value="Retail">Retail</option>
        <option value="Shipping">Shipping</option>
        <option value="Technology">Technology</option>
        <option value="Telecommunications">Telecommunications</option>
        <option value="Transportation">Transportation</option>
        <option value="Utilities">Utilities</option>
        <option value="Other">Other</option>
      </select>
    </div>
  </div>
</fieldset>

<fieldset>
  <legend>Service Request Details</legend>
  <div class="grid">
    <div class="field">
      <label for="00NDn00000Drp9H">Product Interest<span class="req">*</span></label>
      <select id="00NDn00000Drp9H" name="00NDn00000Drp9H" title="Product Interest" required>
        <option value="">--None--</option>
        <option value="Hardware">Hardware</option>
        <option value="Software License">Software License</option>
        <option value="Managed IT Support">Managed IT Support</option>
        <option value="Network Infrastructure">Network Infrastructure</option>
        <option value="Cloud Services">Cloud Services</option>
        <option value="Cybersecurity">Cybersecurity</option>
        <option value="Bundled Solution">Bundled Solution</option>
        <option value="Other">Other</option>
        <option value="Cloud Management">Cloud Management</option>
        <option value="Security">Security</option>
      </select>
    </div>
    <div class="field">
      <label for="00NDn000011olWI">Province Where Service is Required<span class="req">*</span></label>
      <select id="00NDn000011olWI" name="00NDn000011olWI" title="Province Where Service is Required" required>
        <option value="">--None--</option>
        <option value="Alberta">Alberta</option>
        <option value="British Columbia">British Columbia</option>
        <option value="Nova Scotia">Nova Scotia</option>
        <option value="Ontario">Ontario</option>
        <option value="Quebec">Quebec</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="field">
      <label for="00NDn000011olWN">Service Location</label>
      <input id="00NDn000011olWN" maxlength="255" name="00NDn000011olWN" size="20" type="text" />
    </div>
    <div class="field full">
      <label for="description">Description</label>
      <textarea name="description"></textarea>
    </div>
  </div>
  <div class="checkbox-row">
    <input id="00NDn000006EBqk" name="00NDn000006EBqk" type="checkbox" value="1" />
    <label for="00NDn000006EBqk">Existing Customer</label>
  </div>
</fieldset>

<input type="hidden" id="lead_source" name="lead_source" value="Web" />

<input type="submit" name="submit" value="Submit">

</form>
</div>
</body>
</html>
